<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ทดสอบ LIFF</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h1>ทดสอบ LIFF get LineUserID</h1>
    <p>Your LINE ID: <span id="user-id" style="color: blue; font-weight: bold;">กำลังโหลด...</span></p>

    <script>
        async function main() {
            try {
                // 1. เริ่มการทำงาน LIFF (อย่าลืมเปลี่ยน YOUR_LIFF_ID เป็นของจริงจาก LINE Console)
                await liff.init({ liffId: "2009179011-zi2JZ0h4" }); 

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const userId = profile.userId;

                    // แสดงผลบนหน้าจอ
                    document.getElementById('user-id').innerText = userId;

                    // Debug ดูใน Console (กด F12 ใน Browser)
                    console.log("Profile:", profile);
                    console.log("User ID:", userId);
                }
            } catch (error) {
                console.error("LIFF Error:", error);
                document.getElementById('user-id').innerText = "เกิดข้อผิดพลาด: " + error.message;
            }
        }
        main();
    </script>
</body>
</html>
