<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I SOM CPU - Service Request</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<p >Your LINE ID: <span id="user-id" style="color: blue; font-weight: bold;">กำลังโหลด...</span></p>
<div class="mobile-container">
    <div class="welcome-banner p-0">  
        <div class="user-info-box">
            <img src="https://placehold.co/100x100?text=Profile" alt="Profile" class="profile-pic">
            <div class="welcome-text">
                <h2>ยินดีต้อนรับ</h2>
                <h3>- Nutt -</h3>
            </div>
        </div>
        <div class="welcome-instruction pe-3">กรุณากรอกข้อมูลเพื่อส่งซ่อม</div>
    </div>

    <div class="form-container">
        <form>
            <div class="mb-3">
                <label class="form-label">ชื่อ-นามสกุล :</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <div class="icon-circle">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </span>
                    <input type="text" id="inputName" class="form-control" placeholder="กรุณากรอกชื่อ-นามสกุล">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">เบอร์โทรศัพท์ :</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <div class="icon-circle">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                    </span>
                    <input type="tel" id="inputPhone" class="form-control" placeholder="กรุณากรอกเบอร์โทรศัพท์ 10 หลัก">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">ที่อยู่รับเครื่อง :</label>
                <div class="input-group mb-2">
                    <span class="input-group-text">
                        <div class="icon-circle">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                    </span>
                    <input type="text" id="inputAddressMain" class="form-control" placeholder="บ้านเลขที่ / หมู่ / ซอย / ถนน">
                </div>
                
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <select id="inputSubDistrict" class="form-select no-icon">
                            <option selected>ตำบล/แขวง</option>
                            <option value="บัง">บัง</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <select id="inputDistrict" class="form-select no-icon">
                            <option selected>อำเภอ/เขต</option>
                            <option value="ลาดบัง">ลาดบัง</option>
                        </select>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <select id="inputProvince" class="form-select no-icon">
                            <option selected>จังหวัด</option>
                            <option value="กรุงเทพมหานคร">กรุงเทพมหานคร</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <input type="text" id="inputZip" class="form-control no-icon" placeholder="รหัสไปรษณีย์">
                    </div>
                </div>
            </div>

            <hr class="text-muted my-4">

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-end"><label class="form-label m-0">ประเภท :</label></div>
                <div class="col-9">
                    <select id="inputDevice" class="form-select no-icon">
                        <option selected>กรุณาเลือกประเภท</option>
                        <option value="pc">PC Desktop</option>
                        <option value="notebook">Notebook/Laptop</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-end"><label class="form-label m-0">ปัญหา :</label></div>
                <div class="col-9">
                    <input type="text" id="inputProblem" class="form-control no-icon" placeholder="เปิดเครื่องไม่ติด/ เครื่องช้า / เพิ่ม SSD / ลงวินโดวส์ใหม่">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-end"><label class="form-label m-0">รายละเอียด :</label></div>
                <div class="col-9">
                    <input type="text" id="inputDetail" class="form-control no-icon">
                </div>
            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-3 text-end"><label class="form-label m-0">แนบรูป/วิดีโอ :</label></div>
                <div class="col-8">
                    <label class="upload-btn">
                        <i class="fa-solid fa-circle-arrow-up"></i> อัปโหลดรูป/วิดีโอ
                        <input type="file" style="display: none;" accept="image/*,video/*">
                    </label>
                </div>
            </div>

            <hr class="text-muted my-4">

            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label">ยืนยันนัดรับเครื่องวันที่ :</label>
                    <div class="input-group">
                        <input type="date" id="inputDate" class="form-control">
                    </div>
                </div>
                <div class="col-6">
                    <label class="form-label">ยืนยันนัดรับเครื่องเวลา :</label>
                    <div class="input-group">
                        <input type="time" id="inputTime" class="form-control">
                    </div>
                </div>
            </div>

            <button type="button" class="submit-btn" data-bs-toggle="modal" data-bs-target="#confirmModal" onclick="copyData()">ส่งข้อมูลการซ่อม</button>

        </form>
    </div>
</div>


<!-- ############################## Modal ############################## -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            
            <div class="modal-top text-center">
                <h4 class="mb-1 fw-bold">ยืนยันส่งข้อมูลใช่ไหม?</h4>
                <p class="mb-0 text-light">โปรดตรวจสอบข้อมูลก่อนส่ง</p>
            </div>
            
            <div class="modal-bottom">
                
                <div class="confirm-data-row">
                    <div class="icon-circle me-2"><i class="fa-solid fa-user"></i></div>
                    <span id="modalName">...</span>
                </div>
                <div class="confirm-data-row">
                    <div class="icon-circle me-2"><i class="fa-solid fa-phone"></i></div>
                    <span id="modalPhone">...</span>
                </div>
                <div class="confirm-data-row">
                    <div class="icon-circle me-2 align-self-start mt-1"><i class="fa-solid fa-location-dot"></i></div>
                    <span id="modalAddress">...</span>
                </div>
                <div class="confirm-data-row">
                    <div class="icon-circle me-2"><i class="fa-solid fa-laptop"></i></div>
                    <span id="modalDevice">...</span>
                </div>
                <div class="confirm-data-row">
                    <div class="icon-circle me-2"><i class="fa-solid fa-circle-question"></i></div>
                    <span id="modalProblem">...</span>
                </div>
                <div class="confirm-data-row">
                    <div class="icon-circle me-2"><i class="fa-regular fa-calendar"></i></div>
                    <span>วันนัดรับเครื่อง: <span id="modalDate">...</span></span>
                </div>
                <div class="confirm-data-row">
                    <div class="icon-circle me-2"><i class="fa-regular fa-clock"></i></div>
                    <span>ช่วงเวลา: <span id="modalTime">...</span></span>
                </div>

                <div class="d-flex justify-content-center gap-4 mt-4">
                    <button type="button" class="btn btn-cancel rounded-pill px-4" data-bs-dismiss="modal">แก้ไขข้อมูล</button>
                    <button type="button" class="btn btn-confirm rounded-pill px-4" id="ConfirmDate">ยืนยัน</button>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
    let userId = "";
    initLiff();
    async function initLiff() {
            try {
                // 1. เริ่มการทำงาน LIFF (อย่าลืมเปลี่ยน YOUR_LIFF_ID เป็นของจริงจาก LINE Console)
                await liff.init({ liffId: "2009179011-zi2JZ0h4" }); 
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const userId = profile.userId;

                    // แสดงผลบนหน้าจอ
                    document.getElementById('user-id').innerText = userId;
                }
            } catch (error) {
                console.error("LIFF Error:", error);
                document.getElementById('user-id').innerText = "เกิดข้อผิดพลาด: " + error.message;
            }
        }
</script>

<script src="script.js">
    Confirmform = document.getElementById('ConfirmDate');
    Confirmform.addEventListener("click",async function (e){
        e.preventDefault();
            console.log("กำลังส่งข้อมูล..."); // เช็คว่าฟังก์ชันทำงานไหม
            // ✅ ดึงค่าโดยตรงจากตัวหนังสือสีน้ำเงินที่โชว์บนหน้าจอ (span id="user-id")
            const lineIdFromSpan = document.getElementById('user-id').innerText;

            // ตรวจสอบเบื้องต้น ถ้ายังโหลดไม่เสร็จไม่ให้ส่ง
            if (!lineIdFromSpan || lineIdFromSpan === "กำลังโหลด...") {
                alert("กรุณารอให้ระบบโหลด LINE ID ให้สำเร็จก่อนครับ");
                return;
            }
            const now = new Date()
            full_address = document.getElementById('inputAddressMain').value + " " + document.getElementById('inputSubDistrict').value + " " + document.getElementById('inputDistrict').value; + " " + document.getElementById('inputProvince').value; + " " + document.getElementById('inputZip').value;
            // ... (ส่วนการเตรียม data เหมือนเดิม)
            const repairData = {
                // ตรวจสอบชื่อ Key ด้านซ้ายมือให้ตรงกับ Schema ใน FastAPI เป๊ะๆ
                lineUserId: lineIdFromSpan,
                fullName: document.getElementById('inputName').value,
                phoneNumber: document.getElementById('inputPhone').value,
                queueId: "A" + Math.floor(Math.random() * 900000 + 100000),
                deviceType: document.getElementById('inputDevice').value,
                problemType: document.getElementById('inputProblem').value,
                problemDetail: document.getElementById('inputDetail').value,
                address: full_address,
                deliveryDate: now.getDate(),
                pickupDate: document.getElementById('inputDate').value,
            };

            try {
                const response = await fetch('https://uncautiously-overwealthy-margie.ngrok-free.dev/repairs/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(repairData)
                });

                const result = await response.json(); // อ่านคำตอบจาก Server

                if (response.ok) {
                    alert("แจ้งซ่อมสำเร็จ! เจ้าหน้าที่จะติดต่อกลับโดยเร็ว");
                    liff.closeWindow();
                } else {
                    // ถ้า Server ตอบกลับมาเป็น Error (เช่น 422 หรือ 500)
                    alert("Server Error: " + JSON.stringify(result.detail));
                }
            } catch (error) {
                // ถ้าเชื่อมต่อ Server ไม่ได้เลย (เช่น URL ผิด หรือติด CORS)
                alert("Network Error: " + error.message);
            }
        
    });
</script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</body>
</html>
