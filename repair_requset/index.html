<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แจ้งซ่อมอุปกรณ์</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <h2>แบบฟอร์มแจ้งซ่อม</h2>
    <p>Your LINE ID: <span id="user-id" style="color: blue; font-weight: bold;">กำลังโหลด...</span></p>
    <form id="repairForm">
        <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" id="fullName">
        </div>
        <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="text" id="phoneNumber">
        </div>
        
        <div class="form-group">
            <label>ที่อยู่สำหรับรับ-ส่งเครื่อง</label>
            <textarea id="address" required></textarea>
        </div>

        <div class="form-group">
            <label>ประเภทอุปกรณ์</label>
            <select id="deviceType">
                <option value="Notebook">โน๊ตบุค</option>
                <option value="Computer">คอม</option>
                <option value="Printer">เครื่องพิมพ์</option>
                <option value="iPhone">โทรศัพไอโฟน</option>
            </select>
            
        </div>
        <div class="form-group">
            <label>อาการเสีย</label>
            <input type="text" id="problemType" placeholder="เช่น เปิดไม่ติด, แบตเสื่อม" required>
        </div>
        <div class="form-group">
            <label>รายละเอียดเพิ่มเติม</label>
            <textarea id="problemDetail" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label>วันนัดส่งเครื่อง</label>
            <input type="date" id="deliveryDate">
        </div>

        <div class="form-group">
            <label>วันนัดรับเครื่อง</label>
            <input type="date" id="pickupDate">
        </div>
        
        
        <input type="hidden" id="lineUserId">
        <button type="submit">ส่งข้อมูลแจ้งซ่อม</button>
    </form>

    <script>
        let userId = "";
        initLiff();

        async function initLiff() {
            try {
                // 1. เริ่มการทำงาน LIFF (อย่าลืมเปลี่ยน YOUR_LIFF_ID เป็นของจริงจาก LINE Console)
                await liff.init({ liffId: "2009179011-zi2JZ0h4" }); 
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const userId = profile.userId;

                    // แสดงผลบนหน้าจอ
                    document.getElementById('user-id').innerText = userId;
                    document.getElementById('lineUserId').value = userId;
                }
            } catch (error) {
                console.error("LIFF Error:", error);
                document.getElementById('user-id').innerText = "เกิดข้อผิดพลาด: " + error.message;
            }
        }

        document.getElementById('repairForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("กำลังส่งข้อมูล..."); // เช็คว่าฟังก์ชันทำงานไหม

            // ... (ส่วนการเตรียม data เหมือนเดิม)
            const repairData = {
                fullName: document.getElementById('fullName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                queueId: "A" + Date.now().toString().slice(-6), // สุ่มเลขคิวเบื้องต้น
                lineUserId: document.getElementById('lineUserId').value,
                technicianID: null,
                deviceType: document.getElementById('deviceType').value,
                problemType: document.getElementById('problemType').value,
                problemDetail: document.getElementById('problemDetail').value,
                deliveryDate: document.getElementById('deliveryDate').value,
                pickupDate: document.getElementById('pickupDate').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('https://uncautiously-overwealthy-margie.ngrok-free.dev/repairs/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(repairData)
                });

                const result = await response.json(); // อ่านคำตอบจาก Server

                if (response.ok) {
                    alert("แจ้งซ่อมสำเร็จ! เจ้าหน้าที่จะติดต่อกลับโดยเร็ว");
                    liff.closeWindow();
                } else {
                    // ถ้า Server ตอบกลับมาเป็น Error (เช่น 422 หรือ 500)
                    alert("Server Error: " + JSON.stringify(result.detail));
                }
            } catch (error) {
                // ถ้าเชื่อมต่อ Server ไม่ได้เลย (เช่น URL ผิด หรือติด CORS)
                alert("Network Error: " + error.message);
            }
        });

        
    </script>
</body>
</html>
